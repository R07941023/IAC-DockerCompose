version: "3.8"

services:
  maplestory-dev:
    image: yenyinglu/maplestory
    container_name: maplestory-dev
    hostname: "maplestory-dev"
    working_dir: /app
    command: >
      bash -c "
        rm -f /tmp/.X0-lock &&
        Xvfb :0 -screen 0 1024x768x16 &
        export DISPLAY=:0 &&
        bash /app/run.sh
      "
    ports:
      # login
      - "8484:8484"
      # channel
      - "7575:7575"
      - "7576:7576"
      - "7577:7577"
      # cash
      - "2555:2555"
    volumes:
      - E:/project/maplestory:/app
    networks:
      - backend_net
    environment:
      - server_settings_db_password=${MYSQL_PASSWORD}

    stdin_open: true 

networks:
  backend_net:
